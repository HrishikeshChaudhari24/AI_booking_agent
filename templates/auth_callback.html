<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Success - AI Booking Agent</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center p-5">
                        <div class="mb-4">
                            <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                        </div>
                        
                        <h2 class="mb-3">Authentication Successful!</h2>
                        
                        <p class="lead mb-4">
                            Your Google Calendar has been connected successfully. 
                            You can now use the AI Booking Agent to manage your events.
                        </p>
                        
                        <div class="mb-4">
                            <div class="spinner-border text-primary me-2" role="status" style="width: 1rem; height: 1rem;">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            Redirecting you to the app...
                        </div>
                        
                        <div class="text-muted">
                            <small>
                                If you're not automatically redirected, 
                                <a href="/" class="text-decoration-none">click here</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Auto-redirect to main app after 2 seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 2000);
        
        // Also handle manual click
        document.addEventListener('DOMContentLoaded', () => {
            const link = document.querySelector('a[href="/"]');
            if (link) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = '/';
                });
            }
        });
    </script>
</body>
</html>
